services:
  app:
    build: { context: ., args: { SITE_URL: "${SITE_URL}" } }
    env_file: .env
    environment: { CONTENT_DIR: /repo/content }
    volumes: ["repo:/repo:ro"]  # writeups come from GitHub via the puller, not from the image
    ports: ["127.0.0.1:3000:3000"]  # localhost only: cloudflared on the host forwards the domain here
    mem_limit: 384m
    restart: unless-stopped
  puller:
    image: alpine/git:2.47.2
    entrypoint: ["sh", "/pull-content.sh"]
    environment:
      REPO_URL: "${REPO_URL}"
      BRANCH: "${BRANCH:-main}"
      INTERVAL: "${PULL_INTERVAL:-3600}"
      REVALIDATE_SECRET: "${REVALIDATE_SECRET}"
    volumes: ["./scripts/pull-content.sh:/pull-content.sh:ro", "repo:/repo"]
    mem_limit: 64m
    depends_on: [app]
    restart: unless-stopped
volumes: { repo: {} }
